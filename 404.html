<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Salama Legacy Centre</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --royal-blue: #0A2E5D;
        --gold: #C9A227;
        --bg-light: #F5F7FA;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg-light);
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-top: 5px solid var(--gold);
        border-radius: 12px;
        padding: 48px 32px;
        max-width: 540px;
        box-shadow: 0 10px 25px -5px rgba(10, 46, 93, 0.1);
      }
      .seal {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--royal-blue);
        color: var(--gold);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 28px;
        font-weight: 700;
        border: 2px solid var(--gold);
      }
      h1 {
        font-family: 'Merriweather', serif;
        font-size: 26px;
        color: var(--royal-blue);
        margin-bottom: 12px;
      }
      p {
        color: #64748b;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-block;
        background: var(--royal-blue);
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 15px;
        border: 1px solid var(--gold);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #061c3a;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(10, 46, 93, 0.25);
      }
      .tagline {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 24px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="seal">SLC</div>
      <h1>Page Not Found</h1>
      <p>The page or resource you are looking for does not exist or has been relocated within the Salama Legacy Centre portal.</p>
      <a href="/" class="btn">Return to Homepage</a>
      <div class="tagline">SALAMA LEGACY CENTRE · SERVICE WITH DIGNITY IS OUR HALLMARK</div>
    </div>
  </body>
</html>
